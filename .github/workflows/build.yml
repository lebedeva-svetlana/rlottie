name: Build 32-bit DLL
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build
        run: |
          Get-ChildItem -Recurse -Filter CMakeLists.txt | ForEach-Object { (Get-Content $_.FullName) -replace '-Werror', '' | Set-Content $_.FullName }
          cmake -B build -A Win32 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: rlottie-x86
          path: build/**/Release/*.dll
